# Production pager overlay. Mount this file instead of the null
# alertmanager.yml and provide /etc/alertmanager/webhook_url from a
# secret. Until that secret exists, keep the committed null receivers.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url_file: /etc/alertmanager/webhook_url
        send_resolved: true
  - name: critical
    webhook_configs:
      - url_file: /etc/alertmanager/webhook_url
        send_resolved: true
