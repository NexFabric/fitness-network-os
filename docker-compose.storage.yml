# Real S3-compatible object storage (MinIO) for the P1-3b-RT runtime proof.
#
#   docker compose -f docker-compose.yml -f docker-compose.storage.yml up -d minio minio-init
#   ./backend/scripts/s3_runtime_proof.py
#
# This is a real S3 API server, not a mock: the drill exercises the actual
# S3StorageProvider (put_object with SSE, presigned GET, tenant-scoped delete).
# It is NOT a substitute for proving the production AWS bucket + IAM policy —
# see docs/ops/S3_RUNTIME_PROOF.md for exactly what this does and does not close.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fitness-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fitnessminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fitnessminio123}
      # The application always sends ServerSideEncryption on PutObject, and
      # MinIO refuses SSE with "KMS not configured" unless a key exists. This
      # dev key makes the encrypted write path testable; production uses real
      # AWS SSE-S3 / SSE-KMS instead (see P2-3-IAM).
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-fitness-os-dev-key:eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: fitness-os-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-fitnessminio} ${MINIO_ROOT_PASSWORD:-fitnessminio123} &&
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-fitness-os-reports} &&
      mc anonymous set none local/${S3_BUCKET_NAME:-fitness-os-reports} &&
      mc encrypt set sse-s3 local/${S3_BUCKET_NAME:-fitness-os-reports} || true &&
      echo 'bucket ready: ${S3_BUCKET_NAME:-fitness-os-reports} (private, sse-s3)'
      "
    restart: "no"

volumes:
  minio_data:
