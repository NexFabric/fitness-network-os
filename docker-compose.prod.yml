version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fitness-os-backend-prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CORS_ORIGINS=https://admin.gymclubnex.com,https://scanner.gymclubnex.com
      - ALLOWED_HOSTS=api.gymclubnex.com
      - NOTIFICATION_EMAIL_PROVIDER=smtp
      # Report storage — S3 required in production (validate_production enforces)
      - REPORT_STORAGE_PROVIDER=s3
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION_NAME=${S3_REGION_NAME:-}
      - S3_SSE_ALGORITHM=${S3_SSE_ALGORITHM:-AES256}
      - S3_KMS_KEY_ID=${S3_KMS_KEY_ID:-}
      # QR KMS envelope encryption
      - QR_KMS_MODE=${QR_KMS_MODE:-aws_kms}
      - AWS_KMS_KEY_ID=${AWS_KMS_KEY_ID}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      # Require external PostgreSQL / Redis for true production
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATOR_DATABASE_URL=${MIGRATOR_DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      # Metrics
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN}
      # Real SMTP credentials should be injected via .env
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  outbox-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fitness-os-outbox-worker-prod
    command: ["python", "-m", "app.workers.outbox"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=production
      - COMPONENT_NAME=worker
      - NOTIFICATION_EMAIL_PROVIDER=disabled
      - REPORT_STORAGE_PROVIDER=s3
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - QR_KMS_MODE=${QR_KMS_MODE:-aws_kms}
      - AWS_KMS_KEY_ID=${AWS_KMS_KEY_ID}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fitness-os-notification-worker-prod
    command: ["python", "-m", "app.workers.notification"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=production
      - COMPONENT_NAME=worker
      - NOTIFICATION_EMAIL_PROVIDER=smtp
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - REPORT_STORAGE_PROVIDER=s3
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - QR_KMS_MODE=${QR_KMS_MODE:-aws_kms}
      - AWS_KMS_KEY_ID=${AWS_KMS_KEY_ID}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  report-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fitness-os-report-worker-prod
    command: ["python", "-m", "app.workers.report"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=production
      - COMPONENT_NAME=worker
      - NOTIFICATION_EMAIL_PROVIDER=disabled
      - REPORT_STORAGE_PROVIDER=s3
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION_NAME=${S3_REGION_NAME:-}
      - S3_SSE_ALGORITHM=${S3_SSE_ALGORITHM:-AES256}
      - S3_KMS_KEY_ID=${S3_KMS_KEY_ID:-}
      - QR_KMS_MODE=${QR_KMS_MODE:-aws_kms}
      - AWS_KMS_KEY_ID=${AWS_KMS_KEY_ID}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  retention-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fitness-os-retention-worker-prod
    command: ["python", "-m", "app.workers.retention"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=production
      - COMPONENT_NAME=worker
      - NOTIFICATION_EMAIL_PROVIDER=disabled
      - REPORT_STORAGE_PROVIDER=s3
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - QR_KMS_MODE=${QR_KMS_MODE:-aws_kms}
      - AWS_KMS_KEY_ID=${AWS_KMS_KEY_ID}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy




