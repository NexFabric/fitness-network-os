name: Ops Drills & Recovery Verification

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops_drills:
    name: S3, dump/restore, PITR, and Alert Drills
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Settings() is imported by s3_runtime_proof.py and tls_connection_proof.py.
    # backend/.env is gitignored, so a clean runner has no DATABASE_URL/REDIS_URL
    # unless they are job-scoped. Host port 5433 matches compose postgres.
    env:
      DATABASE_URL: postgresql+asyncpg://fitness_app:fitness_app_password@localhost:5433/fitness_os
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/fitness_os
      REDIS_URL: redis://localhost:6379/0
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Start Postgres, Redis, and MinIO
        run: |
          docker compose up -d postgres redis
          docker compose -f docker-compose.storage.yml up -d
          sleep 15

      - name: Migrate schema before dump/restore
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://fitness_app:fitness_app_password@localhost:5433/fitness_os
          MIGRATOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/fitness_os
          REDIS_URL: redis://localhost:6379/0
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      - name: S3 Storage Runtime Proof Drill
        working-directory: ./backend
        run: uv run python scripts/s3_runtime_proof.py

      - name: Dump / restore drill
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fitness_os
        run: |
          chmod +x backend/scripts/dr_restore_drill.sh
          ./backend/scripts/dr_restore_drill.sh

      - name: PITR drill
        run: |
          chmod +x backend/scripts/pitr_drill.sh
          ./backend/scripts/pitr_drill.sh

      - name: TLS connection smoke
        run: |
          cd backend
          uv run python scripts/tls_connection_proof.py

      - name: Start backend + observability for the alert path
        run: |
          docker compose up -d backend
          docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
          sleep 20

      - name: Observability Alert Fire Drill
        run: |
          chmod +x ops/observability/alert_fire_drill.sh
          ./ops/observability/alert_fire_drill.sh

      - name: Tear down Services
        if: always()
        run: |
          docker compose -f docker-compose.obs.yml down -v || true
          docker compose -f docker-compose.storage.yml down -v || true
          docker compose down -v || true
