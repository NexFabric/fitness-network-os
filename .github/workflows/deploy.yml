name: Deploy choreography

# Manual only. This workflow does not invent a cloud target.
# It builds production images and refuses to report success when
# the GitHub environment has no deploy secrets.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to run the secret-gated steps
        required: true
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file backend/Dockerfile.prod --tag fitness-network-os:${{ github.sha }} backend

      - name: Build admin-web image
        run: >
          docker build
          --file frontend/admin-web/Dockerfile
          --build-arg VITE_API_URL=https://api.gymclubnex.com
          --tag fitness-admin-web:${{ github.sha }}
          frontend

      - name: Build scanner-pwa image
        run: >
          docker build
          --file frontend/scanner-pwa/Dockerfile
          --build-arg VITE_API_URL=https://api.gymclubnex.com
          --tag fitness-scanner-pwa:${{ github.sha }}
          frontend

  promote:
    name: Secret-gated promote
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Refuse missing confirmation
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "EVIDENCE-MISSING: confirmation input must be exactly 'deploy'"
          exit 1

      # Same required set as docker-compose.prod.yml long-lived `backend`.
      # MIGRATOR_DATABASE_URL is migrate-only and must not be required here.
      - name: Refuse missing deploy secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AWS_KMS_KEY_ID: ${{ secrets.AWS_KMS_KEY_ID || vars.AWS_KMS_KEY_ID }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || vars.S3_BUCKET_NAME }}
          METRICS_BEARER_TOKEN: ${{ secrets.METRICS_BEARER_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || vars.SMTP_FROM }}
          QR_KMS_MODE: ${{ vars.QR_KMS_MODE || secrets.QR_KMS_MODE }}
          NOTIFICATION_EMAIL_PROVIDER: ${{ vars.NOTIFICATION_EMAIL_PROVIDER }}
        run: |
          missing=0
          require() {
            name="$1"
            if [ -z "${!name}" ]; then
              echo "EVIDENCE-MISSING: secret $name is not configured"
              missing=1
            fi
          }

          for name in DATABASE_URL REDIS_URL ENCRYPTION_KEY AWS_KMS_KEY_ID S3_BUCKET_NAME METRICS_BEARER_TOKEN; do
            require "$name"
          done

          # Compose backend hardcodes smtp. Empty var means smtp.
          provider="$(printf '%s' "${NOTIFICATION_EMAIL_PROVIDER:-smtp}" | tr '[:upper:]' '[:lower:]')"
          if [ "$provider" = "smtp" ]; then
            for name in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM; do
              require "$name"
            done
          elif [ "$provider" != "disabled" ]; then
            echo "EVIDENCE-MISSING: NOTIFICATION_EMAIL_PROVIDER must be smtp or disabled"
            missing=1
          fi

          # Compose defaults QR_KMS_MODE=aws_kms; any other value is fail-closed.
          qr_mode="$(printf '%s' "${QR_KMS_MODE:-aws_kms}" | tr '[:upper:]' '[:lower:]')"
          if [ "$qr_mode" != "aws_kms" ]; then
            echo "EVIDENCE-MISSING: QR_KMS_MODE must be aws_kms (compose default), got $qr_mode"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "No cloud was deployed. Configure the GitHub production environment and retry."
            exit 1
          fi
          echo "Long-lived backend secrets present. Platform release command is still operator-owned (see ops/deploy/README.md)."
