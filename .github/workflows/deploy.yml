name: Deploy choreography

# Manual only. This workflow does not invent a cloud target.
# It builds production images and refuses to report success when
# the GitHub environment has no deploy secrets.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to run the secret-gated steps
        required: true
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file backend/Dockerfile.prod --tag fitness-network-os:${{ github.sha }} backend

      - name: Build admin-web image
        run: >
          docker build
          --file frontend/admin-web/Dockerfile
          --build-arg VITE_API_URL=https://api.gymclubnex.com
          --tag fitness-admin-web:${{ github.sha }}
          frontend

      - name: Build scanner-pwa image
        run: >
          docker build
          --file frontend/scanner-pwa/Dockerfile
          --build-arg VITE_API_URL=https://api.gymclubnex.com
          --tag fitness-scanner-pwa:${{ github.sha }}
          frontend

  promote:
    name: Secret-gated promote
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Refuse missing confirmation
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo "EVIDENCE-MISSING: confirmation input must be exactly 'deploy'"
          exit 1

      - name: Refuse missing deploy secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AWS_KMS_KEY_ID: ${{ secrets.AWS_KMS_KEY_ID }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          missing=0
          for name in DATABASE_URL REDIS_URL ENCRYPTION_KEY AWS_KMS_KEY_ID S3_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "EVIDENCE-MISSING: secret $name is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "No cloud was deployed. Configure the GitHub production environment and retry."
            exit 1
          fi
          echo "Secrets present. Platform release command is still operator-owned (see ops/deploy/README.md)."
