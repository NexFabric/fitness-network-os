name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege for every job below: CI only reads the repository. Any job
# that later needs to write (releases, PR comments, packages) must raise its
# own job-level `permissions:` rather than widening this default.
permissions:
  contents: read

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@a7082b69f5bc6167bbe27ebab82bf6707f267bf6 # main as of 2026-08-09
        with:
          path: ./
          extra_args: --debug --only-verified --exclude-detectors=Lob
          
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          
      - name: Install security tools
        run: pip install bandit==1.8.6 pip-audit==2.9.0 uv==0.11.21
        
      - name: SAST Scan (Bandit)
        working-directory: ./backend
        run: bandit -r app/ -ll -ii
        
      - name: SCA Scan (pip-audit)
        working-directory: ./backend
        run: |
          uv export --frozen --format requirements-txt --no-hashes --no-emit-workspace > requirements.txt
          pip-audit -r requirements.txt
        # Safety's `check` CLI no longer boots against current typer/click
        # (TypeError / missing rich_utils). pip-audit is the hard SCA gate.

  # SBOM generation is a compliance artifact, not a merge gate. It lives in
  # its own job because `anchore/sbom-action` downloads syft from GitHub
  # releases at run time: a transient 503 there used to fail `security`, and
  # since `test` needs `security`, an upstream outage silently skipped the
  # entire test suite. Keep continue-on-error and keep this job out of
  # `test.needs` / `all-green.needs`.
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action fetches the syft binary from GitHub releases at run time, which
    # has returned 000/503 repeatedly. An upstream asset outage is not a defect
    # in this repository and must not paint `main` red: the job still reports its
    # own failure, but the run's conclusion is decided by the actual gates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install uv
        run: pip install uv==0.11.21
        
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen && uv pip install pyyaml
        
      - name: Lint with ruff
        working-directory: ./backend
        run: uv run ruff check .

      - name: Format check with ruff
        working-directory: ./backend
        run: uv run ruff format --check .

      - name: Type check with mypy
        working-directory: ./backend
        run: uv run mypy app
        
      - name: Check tenancy enforcement (Static)
        working-directory: ./backend
        run: uv run python scripts/check_tenancy.py --static
        
      - name: Check permissions matrix
        working-directory: ./backend
        run: uv run python scripts/check_permissions.py

      - name: Architecture fitness — no money floats
        working-directory: ./backend
        run: uv run python scripts/check_no_money_floats.py

      - name: Release truth documents
        working-directory: ./backend
        run: uv run python scripts/check_release_truth.py

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security, lint]
    env:
      ENVIRONMENT: "test"
      ALLOW_DESTRUCTIVE_TEST_RESET: "1"
      DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
      TEST_RUNTIME_DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/fitness_test_db
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fitness_user
          POSTGRES_PASSWORD: fitness_password
          POSTGRES_DB: fitness_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install uv
        run: pip install uv==0.11.21
        
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --frozen
        
      - name: Run Migrations
        working-directory: ./backend
        run: uv run alembic upgrade head
        
      - name: Check for Schema Drift
        working-directory: ./backend
        run: uv run alembic check
        
      - name: Check tenancy enforcement (Dynamic)
        working-directory: ./backend
        run: uv run python scripts/check_tenancy.py

      - name: Check permissions YAML ↔ DB parity
        working-directory: ./backend
        run: |
          uv pip install pyyaml psycopg[binary]
          uv run python scripts/check_permissions_db.py
        
      - name: Run Pytest with Real DB
        working-directory: ./backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=70

      - name: Critical-module coverage floors
        working-directory: ./backend
        run: uv run python scripts/check_critical_coverage.py --coverage coverage.json

  # Phase 21 CI V2 — frontend production builds (workspace lockfile at frontend/)
  admin-web:
    name: Admin Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: npm audit (high+)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Lint admin-web
        working-directory: ./frontend/admin-web
        run: npm run lint

      - name: Build admin-web
        working-directory: ./frontend/admin-web
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  scanner-pwa:
    name: Scanner PWA Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: npm audit (high+)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Lint scanner-pwa
        working-directory: ./frontend/scanner-pwa
        run: npm run lint

      - name: Build scanner-pwa
        working-directory: ./frontend/scanner-pwa
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  production-image:
    name: Production Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build frozen non-root backend image
        run: docker build --file backend/Dockerfile.prod --tag fitness-network-os:${{ github.sha }} backend

  frontend-images:
    name: Frontend Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build admin-web image (workspace lockfile + SPA nginx)
        run: >
          docker build
          --file frontend/admin-web/Dockerfile
          --build-arg VITE_API_URL=http://localhost:8000
          --tag fitness-admin-web:${{ github.sha }}
          frontend

      - name: Build scanner-pwa image (workspace lockfile + SPA nginx)
        run: >
          docker build
          --file frontend/scanner-pwa/Dockerfile
          --build-arg VITE_API_URL=http://localhost:8000
          --tag fitness-scanner-pwa:${{ github.sha }}
          frontend

  public-site:
    name: Public Site Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/public-site/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/public-site
        run: npm ci

      - name: npm audit (high+)
        working-directory: ./frontend/public-site
        run: npm audit --audit-level=high

      - name: Lint public-site
        working-directory: ./frontend/public-site
        run: npm run lint

      - name: Build public-site
        working-directory: ./frontend/public-site
        env:
          NEXT_PUBLIC_ADMIN_URL: http://localhost:5173
        run: npm run build

  browser-e2e:
    name: Playwright Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [test, admin-web, scanner-pwa]
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/fitness_e2e_db
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_e2e_db
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_LOGIN_MAX_REQUESTS: 500
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      E2E_OWNER_TOTP_SECRET: JBSWY3DPEHPK3PXP
      VITE_API_URL: http://localhost:8000
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fitness_user
          POSTGRES_PASSWORD: fitness_password
          POSTGRES_DB: fitness_e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv==0.11.21

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --frozen

      - name: Migrate and provision the RLS runtime role
        working-directory: ./backend
        env:
          PGPASSWORD: fitness_password
        run: |
          uv run alembic upgrade head
          psql -h localhost -U fitness_user -d fitness_e2e_db -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user WITH LOGIN PASSWORD 'app_password' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO app_user;
          SQL

      - name: Seed browser principals
        working-directory: ./backend
        run: uv run python scripts/seed_role_matrix.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: ./frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright against the real API
        working-directory: ./frontend/e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 7

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/analyze@v4

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Independent of the test graph. An upstream scanner outage must not
    # skip pytest. Not part of all-green until HIGH/CRITICAL are zero on
    # a known-good baseline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file backend/Dockerfile.prod --tag fitness-network-os:scan backend

      - name: Trivy vulnerability scan
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore"
          aquasec/trivy:0.58.1 image
          --severity HIGH,CRITICAL
          --ignorefile /.trivyignore
          --exit-code 0
          --no-progress
          fitness-network-os:scan

  all-green:
    name: All Required Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        test,
        admin-web,
        scanner-pwa,
        public-site,
        production-image,
        frontend-images,
        browser-e2e,
        codeql,
      ]
    steps:
      - name: Ready to merge
        run: echo "All required checks passed!"
