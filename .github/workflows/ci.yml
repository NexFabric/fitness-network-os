name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install security tools
        run: pip install bandit pip-audit uv safety
        
      - name: SAST Scan (Bandit)
        working-directory: ./backend
        run: bandit -r app/ -ll -ii
        
      - name: SCA Scan (pip-audit)
        working-directory: ./backend
        run: |
          uv pip compile pyproject.toml -o requirements.txt
          pip-audit -r requirements.txt || true
          
      - name: Dependency Vulnerability Scan (Safety)
        working-directory: ./backend
        run: safety check || echo "Safety found vulnerabilities, but continuing for now"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        working-directory: ./backend
        run: uv pip install --system -r pyproject.toml
        
      - name: Lint with ruff
        working-directory: ./backend
        run: uv run ruff check .
        
      - name: Type check with mypy
        working-directory: ./backend
        run: uv run mypy app
        
      - name: Check tenancy enforcement
        working-directory: ./backend
        run: python scripts/check_tenancy.py
        
      - name: Check permissions matrix
        working-directory: ./backend
        run: python scripts/check_permissions.py

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [security, lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fitness_user
          POSTGRES_PASSWORD: fitness_password
          POSTGRES_DB: fitness_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        working-directory: ./backend
        run: uv pip install --system -r pyproject.toml
        
      - name: Run Pytest with Real DB
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
        run: uv run pytest
