name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          extra_args: --debug --only-verified
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install security tools
        run: pip install bandit pip-audit uv safety
        
      - name: SAST Scan (Bandit)
        working-directory: ./backend
        run: bandit -r app/ -ll -ii
        
      - name: SCA Scan (pip-audit)
        working-directory: ./backend
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-workspace > requirements.txt
          pip-audit -r requirements.txt
          
      - name: Dependency Vulnerability Scan (Safety)
        working-directory: ./backend
        run: safety check

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install uv
        run: pip install uv==0.11.21
        
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync
        
      - name: Lint with ruff
        working-directory: ./backend
        run: uv run ruff check .
        
      - name: Type check with mypy
        working-directory: ./backend
        run: uv run mypy app
        
      - name: Check tenancy enforcement (Static)
        working-directory: ./backend
        run: uv run python scripts/check_tenancy.py --static
        
      - name: Check permissions matrix
        working-directory: ./backend
        run: uv run python scripts/check_permissions.py

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [security, lint]
    env:
      DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
      TEST_RUNTIME_DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/fitness_test_db
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://fitness_user:fitness_password@localhost:5432/fitness_test_db
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fitness_user
          POSTGRES_PASSWORD: fitness_password
          POSTGRES_DB: fitness_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install uv
        run: pip install uv==0.11.21
        
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync
        
      - name: Run Migrations
        working-directory: ./backend
        run: uv run alembic upgrade head
        
      - name: Check for Schema Drift
        working-directory: ./backend
        run: uv run alembic check
        
      - name: Check tenancy enforcement (Dynamic)
        working-directory: ./backend
        run: uv run python scripts/check_tenancy.py
        
      - name: Run Pytest with Real DB
        working-directory: ./backend
        run: uv run pytest
