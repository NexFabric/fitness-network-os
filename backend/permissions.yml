# Canonical RBAC matrix — source of truth for roles/permissions.
# CI: scripts/check_permissions.py (YAML internal)
# CI (after migrate): scripts/check_permissions_db.py (YAML ↔ PostgreSQL)

roles:
  PLATFORM_SUPER_ADMIN:
    description: "Full access to entire platform"
    permissions:
      - "*"
  FEDERATION_ADMIN:
    description: "Full access to a specific federation and its gyms"
    permissions:
      - "federation:read"
      - "federation:write"
      - "gym:read"
      - "gym:write"
      - "users:read"
      - "users:write"
  FEDERATION_ANALYST:
    description: "Read-only access to federation analytics"
    permissions:
      - "federation:read"
      - "gym:read"
  FEDERATION_SUPPORT:
    description: "Support access for federation"
    permissions:
      - "federation:read"
      - "gym:read"
      - "users:read"
  GYM_OWNER:
    description: "Owner of a specific gym tenant"
    permissions:
      - "gym:read"
      - "gym:write"
      - "memberships:read"
      - "memberships:write"
      - "checkins:read"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "entitlements:manage"
      - "finance:read"
      - "finance:write"
      - "finance:refund"
      - "finance:credit"
      - "finance:manage"
      - "finance:reconcile"
      - "access:issue"
      - "access:validate"
      - "access:keys"
      - "access:read"
      - "members:read"
      - "members:write"
      - "locations:read"
      - "locations:write"
      - "staff:read"
      - "staff:write"
      - "notifications:read"
      - "notifications:write"
      - "notifications:send"
      - "reports:read"
      - "reports:write"
      - "reports:run"
      # outbox/inbox: internal/service only (15.5C) — no tenant role grants
  GYM_ADMIN:
    description: "Admin of a specific gym tenant"
    permissions:
      - "gym:read"
      - "gym:write"
      - "memberships:read"
      - "memberships:write"
      - "checkins:read"
      - "users:read"
      - "users:write"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "entitlements:manage"
      - "finance:read"
      - "finance:write"
      - "finance:refund"
      - "finance:credit"
      - "finance:manage"
      - "finance:reconcile"
      - "access:issue"
      - "access:validate"
      - "access:keys"
      - "access:read"
      - "members:read"
      - "members:write"
      - "locations:read"
      - "locations:write"
      - "staff:read"
      - "staff:write"
      - "notifications:read"
      - "notifications:write"
      - "notifications:send"
      - "reports:read"
      - "reports:write"
      - "reports:run"
  GYM_MANAGER:
    description: "Manager of a specific gym tenant"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "memberships:write"
      - "checkins:read"
      - "users:read"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "finance:read"
      - "finance:write"
      - "access:issue"
      - "access:validate"
      - "access:read"
      - "members:read"
      - "members:write"
      - "locations:read"
      - "staff:read"
      - "notifications:read"
      - "notifications:send"
      - "reports:read"
      - "reports:run"
  ACCOUNTANT:
    description: "Accountant for a gym"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "entitlements:read"
      - "finance:read"
      - "finance:write"
      - "finance:refund"
      - "finance:credit"
      - "finance:manage"
      - "finance:reconcile"
      - "reports:read"
  FRONT_DESK:
    description: "Front desk staff"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "checkins:read"
      - "checkins:write"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "access:issue"
      - "access:validate"
      - "access:read"
      - "members:read"
      - "members:write"
      - "locations:read"
      - "notifications:read"
      - "notifications:send"
  TRAINER:
    description: "Trainer in a gym"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "checkins:read"
      - "entitlements:read"
      - "entitlements:check"
      - "access:read"
      - "members:read"
      - "locations:read"
  MEMBER:
    description: "A standard gym member (self-service only; no tenant-wide member/domain perms)"
    permissions:
      - "profile:read"
      - "profile:write"
      - "memberships:read:self"
      - "checkins:read:self"
      - "checkins:write:self"
      - "entitlements:read:self"
      - "entitlements:check:self"
      - "access:issue:self"

permissions:
  - id: "federation:read"
    description: "Read federation details"
  - id: "federation:write"
    description: "Modify federation details"
  - id: "gym:read"
    description: "Read gym details"
  - id: "gym:write"
    description: "Modify gym details"
  - id: "users:read"
    description: "Read users in context"
  - id: "users:write"
    description: "Modify users in context"
  - id: "memberships:read"
    description: "Read memberships (tenant staff)"
  - id: "memberships:read:self"
    description: "Read own memberships via /me (bound member)"
  - id: "memberships:write"
    description: "Modify memberships"
  - id: "checkins:read"
    description: "Read checkin history (tenant staff)"
  - id: "checkins:read:self"
    description: "Read own checkins via /me (bound member)"
  - id: "checkins:write"
    description: "Create checkins (tenant staff)"
  - id: "checkins:write:self"
    description: "Create own checkins via /me (bound member)"
  - id: "entitlements:read"
    description: "Read entitlement balances and definitions (tenant staff)"
  - id: "entitlements:read:self"
    description: "Read own entitlements via /me (bound member)"
  - id: "entitlements:check"
    description: "Check entitlement without mutation (tenant staff)"
  - id: "entitlements:check:self"
    description: "Check own entitlement via /me (bound member)"
  - id: "entitlements:consume"
    description: "Consume entitlement balance"
  - id: "entitlements:manage"
    description: "Manage entitlement definitions and allocations"
  - id: "finance:read"
    description: "Read billing accounts, invoices, payments"
  - id: "finance:write"
    description: "Create invoices and record payments"
  - id: "finance:refund"
    description: "Issue payment refunds"
  - id: "finance:credit"
    description: "Issue and apply account credits"
  - id: "finance:manage"
    description: "Manage discounts and finance configuration"
  - id: "finance:reconcile"
    description: "Run payment reconciliation"
  - id: "profile:read"
    description: "Read own profile"
  - id: "profile:write"
    description: "Update own profile"
  - id: "access:issue"
    description: "Issue short-lived QR access credentials for any member (staff)"
  - id: "access:issue:self"
    description: "Issue short-lived QR access credentials for own bound member profile"
  - id: "access:validate"
    description: "Validate QR credentials and record access"
  - id: "access:keys"
    description: "Manage QR signing key rotation"
  - id: "access:read"
    description: "Read access attempts and checkins"
  - id: "members:read"
    description: "Read member profiles"
  - id: "members:write"
    description: "Create and update members"
  - id: "locations:read"
    description: "Read gym locations/branches"
  - id: "locations:write"
    description: "Create and update locations"
  - id: "staff:read"
    description: "Read staff links"
  - id: "staff:write"
    description: "Link users as staff"
  - id: "outbox:write"
    description: "Enqueue outbox events (internal/service principal only; not tenant HTTP)"
  - id: "outbox:dispatch"
    description: "Dispatch claimed outbox events (platform/worker only; not tenant roles)"
  - id: "outbox:read"
    description: "Read outbox status (operational; no tenant grant in 15.5C)"
  - id: "inbox:write"
    description: "Receive inbox events (provider webhooks only; not tenant HTTP)"
  - id: "inbox:read"
    description: "Read inbox status (operational; no tenant grant in 15.5C)"
  - id: "notifications:read"
    description: "Read notification templates and delivery status (tenant staff)"
  - id: "notifications:write"
    description: "Create and manage notification templates (tenant staff)"
  - id: "notifications:send"
    description: "Schedule notification deliveries (tenant staff)"
  - id: "reports:read"
    description: "Read report definitions and run status (tenant staff)"
  - id: "reports:write"
    description: "Create and manage report definitions (tenant staff)"
  - id: "reports:run"
    description: "Request report runs (tenant staff)"
  - id: "*"
    description: "Superuser wildcard"
