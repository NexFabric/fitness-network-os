roles:
  PLATFORM_SUPER_ADMIN:
    description: "Full access to entire platform"
    permissions:
      - "*"
  FEDERATION_ADMIN:
    description: "Full access to a specific federation and its gyms"
    permissions:
      - "federation:read"
      - "federation:write"
      - "gym:read"
      - "gym:write"
      - "users:read"
      - "users:write"
  FEDERATION_ANALYST:
    description: "Read-only access to federation analytics"
    permissions:
      - "federation:read"
      - "gym:read"
  FEDERATION_SUPPORT:
    description: "Support access for federation"
    permissions:
      - "federation:read"
      - "gym:read"
      - "users:read"
  GYM_OWNER:
    description: "Owner of a specific gym tenant"
    permissions:
      - "gym:read"
      - "gym:write"
      - "memberships:read"
      - "memberships:write"
      - "checkins:read"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "entitlements:manage"
      - "finance:read"
      - "finance:write"
      - "finance:refund"
      - "finance:credit"
      - "finance:manage"
      - "finance:reconcile"
  GYM_ADMIN:
    description: "Admin of a specific gym tenant"
    permissions:
      - "gym:read"
      - "gym:write"
      - "memberships:read"
      - "memberships:write"
      - "checkins:read"
      - "users:read"
      - "users:write"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "entitlements:manage"
      - "finance:read"
      - "finance:write"
      - "finance:refund"
      - "finance:credit"
      - "finance:manage"
      - "finance:reconcile"
  GYM_MANAGER:
    description: "Manager of a specific gym tenant"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "memberships:write"
      - "checkins:read"
      - "users:read"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
      - "finance:read"
      - "finance:write"
  ACCOUNTANT:
    description: "Accountant for a gym"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "entitlements:read"
      - "finance:read"
      - "finance:write"
      - "finance:refund"
      - "finance:credit"
      - "finance:manage"
      - "finance:reconcile"
  FRONT_DESK:
    description: "Front desk staff"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "checkins:read"
      - "checkins:write"
      - "entitlements:read"
      - "entitlements:check"
      - "entitlements:consume"
  TRAINER:
    description: "Trainer in a gym"
    permissions:
      - "gym:read"
      - "memberships:read"
      - "checkins:read"
      - "entitlements:read"
      - "entitlements:check"
  MEMBER:
    description: "A standard gym member"
    permissions:
      - "profile:read"
      - "profile:write"
      - "memberships:read"
      - "checkins:read"
      - "checkins:write"
      - "entitlements:read"
      - "entitlements:check"

permissions:
  - id: "federation:read"
    description: "Read federation details"
  - id: "federation:write"
    description: "Modify federation details"
  - id: "gym:read"
    description: "Read gym details"
  - id: "gym:write"
    description: "Modify gym details"
  - id: "users:read"
    description: "Read users in context"
  - id: "users:write"
    description: "Modify users in context"
  - id: "memberships:read"
    description: "Read memberships"
  - id: "memberships:write"
    description: "Modify memberships"
  - id: "checkins:read"
    description: "Read checkin history"
  - id: "checkins:write"
    description: "Create checkins"
  - id: "entitlements:read"
    description: "Read entitlement balances and definitions"
  - id: "entitlements:check"
    description: "Check entitlement without mutation"
  - id: "entitlements:consume"
    description: "Consume entitlement balance"
  - id: "entitlements:manage"
    description: "Manage entitlement definitions and allocations"
  - id: "finance:read"
    description: "Read billing accounts, invoices, payments"
  - id: "finance:write"
    description: "Create invoices and record payments"
  - id: "finance:refund"
    description: "Issue payment refunds"
  - id: "finance:credit"
    description: "Issue and apply account credits"
  - id: "finance:manage"
    description: "Manage discounts and finance configuration"
  - id: "finance:reconcile"
    description: "Run payment reconciliation"
  - id: "profile:read"
    description: "Read own profile"
  - id: "profile:write"
    description: "Update own profile"
  - id: "*"
    description: "Superuser wildcard"
